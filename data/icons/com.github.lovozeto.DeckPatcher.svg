<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: dark rounded square -->
  <rect width="128" height="128" rx="28" ry="28" fill="#1a1a1e"/>

  <!-- Wrench body -->
  <g fill="none" stroke="#e8e8ec" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle -->
    <line x1="75" y1="75" x2="100" y2="100"/>

    <!-- Wrench head ring -->
    <circle cx="46" cy="46" r="18" stroke="#e8e8ec" stroke-width="7" fill="none"/>

    <!-- Inner cut-out of wrench head -->
    <circle cx="46" cy="46" r="9" stroke="#1a1a1e" stroke-width="9" fill="#1a1a1e"/>

    <!-- Patch badge — small accent square at bottom-right -->
  </g>

  <!-- Accent dot: patch indicator -->
  <rect x="78" y="78" width="26" height="26" rx="6" fill="#5b8def"/>
  <line x1="84" y1="91" x2="98" y2="91" stroke="#e8e8ec" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="91" y1="84" x2="91" y2="98" stroke="#e8e8ec" stroke-width="3.5" stroke-linecap="round"/>
</svg>
