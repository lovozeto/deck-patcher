[mypy]
strict = true
python_version = 3.12

# backend.py subclasses QObject and uses pyqtProperty/pyqtSlot decorators,
# both of which are Any because PyQt6 ships no stubs.
# Disable only the two checks that are impossible to satisfy without stubs.
[mypy-backend]
disallow_subclassing_any = false
disallow_untyped_decorators = false
