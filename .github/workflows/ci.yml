name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install ruff mypy pytest vdf requests python-steamgriddb jsonschema
      - name: Lint
        run: ruff check src/
      - name: Type check
        run: mypy --strict src/
      - name: Test
        run: pytest tests/ -v
